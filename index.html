    body {

    }

    .dropdown-container {
      margin-bottom: 20px;
    }

    .dropdown {
      position: relative;
      width: 300px;
    }

    .dropdown-button {
      width: 100%;
      padding: 10px;
      background-color: white;
      border: 1px solid #ccc;
      cursor: pointer;
      text-align: left;
    }

    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      background-color: white;
      border: 1px solid #ccc;
      display: none;
      z-index: 10;
    }

    .dropdown-search {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border-bottom: 1px solid #ccc;
    }

    .dropdown-options {
      max-height: 200px;
      overflow-y: auto;
    }

    .dropdown-options div {
      padding: 8px 10px;
      cursor: pointer;
    }

    .dropdown-options div:hover {
      background-color: #eee;
    }
  </style>

    function renderCharacterOptions(dropdown) {
      const searchInput = dropdown.querySelector('.dropdown-search');
      const optionsContainer = dropdown.querySelector('.dropdown-options');
      const selectedValues = Array.from(document.querySelectorAll('.character-dropdown .dropdown-button'))
        .map(b => b.textContent)
        .filter(text => text !== 'Select Character' && text !== dropdown.querySelector('.dropdown-button').textContent);
      const filter = searchInput.value.toLowerCase();

      optionsContainer.innerHTML = '';
      const filtered = characters.filter(c => !selectedValues.includes(c) && c.toLowerCase().includes(filter));
      filtered.forEach(char => {
        const div = document.createElement('div');
        div.textContent = char;
        div.addEventListener('click', () => {
          dropdown.querySelector('.dropdown-button').textContent = char;
          dropdown.querySelector('.dropdown-menu').style.display = 'none';
          document.querySelectorAll('.character-dropdown').forEach(dd => renderCharacterOptions(dd));
        });
        optionsContainer.appendChild(div);
      });
    }

    function renderLightconeOptions(dropdown) {

      const optionsContainer = dropdown.querySelector('.dropdown-options');
      const filter = searchInput.value.toLowerCase();

      optionsContainer.innerHTML = '';
      const filtered = lightcones.filter(lc => lc.toLowerCase().includes(filter));
      filtered.forEach(lc => {
        const div = document.createElement('div');
        div.textContent = lc;
        div.addEventListener('click', () => {
          dropdown.querySelector('.dropdown-button').textContent = lc;
          dropdown.querySelector('.dropdown-menu').style.display = 'none';
        });
        optionsContainer.appendChild(div);
      });
    }

    function setupDropdown(dropdown, isCharacter) {
      const button = dropdown.querySelector('.dropdown-button');
      const menu = dropdown.querySelector('.dropdown-menu');
      const search = dropdown.querySelector('.dropdown-search');

      button.addEventListener('click', () => {
        const isVisible = menu.style.display === 'block';
        document.querySelectorAll('.dropdown-menu').forEach(m => m.style.display = 'none');
        menu.style.display = isVisible ? 'none' : 'block';
        search.value = '';
        if (isCharacter) {
          renderCharacterOptions(dropdown);
        } else {
          renderLightconeOptions(dropdown);
        }
        search.focus();
      });

      search.addEventListener('input', () => {
        if (isCharacter) {
          renderCharacterOptions(dropdown);
        } else {
          renderLightconeOptions(dropdown);
        }
      });
    }

    document.querySelectorAll('.character-dropdown').forEach(dd => setupDropdown(dd, true));
    document.querySelectorAll('.lightcone-dropdown').forEach(dd => setupDropdown(dd, false));

    const lcDropdowns = document.querySelectorAll('.lightcone-dropdown .dropdown-button');

    let lines = [];

    charDropdowns.forEach((charBtn, index) => {
      const charName = charBtn.textContent;
      const lcName = lcDropdowns[index].textContent;

      const charId = charToId[charName];
      const lcId = lcToId[lcName];

      if (charId && lcId) {
        lines.push(`encode_battle_avatar ${charId}, 80, 6, 6, 10000, 10000, 10000, AVATAR_FORMAL_TYPE, ${lcId}, 80, 6, 5`);
      }
    });

    const blob = new Blob([lines.join("\n")], { type: "text/plain" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "team_config.asm";
    link.click();
    URL.revokeObjectURL(link.href);
  });
